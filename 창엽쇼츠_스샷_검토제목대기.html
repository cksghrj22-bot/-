<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>창엽 쇼츠 스샷 — 검토·제목대기</title>
<style>
:root{--bg:#0e1116;--panel:#161b22;--line:#2a3340;--tx:#e6edf3;--mut:#8b98a8;--review:#58a6ff;--wait:#e3b341;--accent:#f0b429}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:26px 18px 56px;max-width:1080px;margin:0 auto;-webkit-font-smoothing:antialiased}
h1{font-size:21px;font-weight:800;letter-spacing:-.3px}
.sub{color:var(--mut);font-size:13px;margin-top:5px}
.badge{display:inline-block;background:rgba(240,71,71,.15);color:#ff8080;border:1px solid rgba(240,71,71,.35);font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:middle}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.6px;margin:28px 0 12px;font-weight:800;display:flex;align-items:center;gap:8px}
h2.sec .c{width:9px;height:9px;border-radius:50%}
h2.rev .c{background:var(--review)} h2.wt .c{background:var(--wait)}
h2.sec small{color:var(--mut);font-weight:600;text-transform:none;letter-spacing:0;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card a{display:block;position:relative;line-height:0}
.card img{width:100%;display:block;aspect-ratio:9/16;object-fit:cover}
.num{position:absolute;top:7px;left:7px;background:rgba(0,0,0,.72);color:#fff;font-size:12px;font-weight:800;padding:2px 7px;border-radius:6px;line-height:1.3}
.dur{position:absolute;bottom:7px;right:7px;background:rgba(0,0,0,.72);color:#dbe4ee;font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;line-height:1.3}
figcaption{padding:9px 10px 11px}
.tt{font-size:12.5px;font-weight:600;color:#dbe4ee;line-height:1.4}
.tt.pend{color:var(--wait)}
.tag{font-size:10px;font-weight:800;background:rgba(227,179,65,.16);color:var(--wait);border:1px solid rgba(227,179,65,.35);padding:1px 5px;border-radius:5px;vertical-align:middle}
.note{font-size:11px;color:var(--mut);margin-top:5px;line-height:1.35}
.hint{color:var(--mut);font-size:12px;margin-top:6px}
.foot{margin-top:26px;border-top:1px solid var(--line);padding-top:14px;color:var(--mut);font-size:12px}
</style></head><body>
